anaconda_config_version: 1
upstream_sources:
  - github:
      identifier: NVIDIA/nvmath-python
      use_max_tag: true
      include_regex: ^v\d+\.\d+\.\d+$
      from_pattern: ^v(.+)$
      to_pattern: \1
    packages:
      - nvmath-python-core
      - nvmath-python
      - nvmath-python-numba
      - nvmath-python-dx
      - nvmath-python-cpu
      - nvmath-python-distributed